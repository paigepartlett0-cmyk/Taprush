<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101329"><title>Tap Rush</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#293568,#101329 65%);font-family:system-ui,-apple-system,sans-serif;color:white;min-height:100dvh;touch-action:manipulation;overflow:hidden}.wrap{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:22px 18px;align-items:center}h1{margin:12px 0 4px;font-size:36px;letter-spacing:2px}.sub{color:#abb7db;margin:0 0 25px}.stats{display:flex;width:100%;justify-content:space-around;text-align:center}.stat b{display:block;font-size:30px}.stat small{color:#b5c1e6;text-transform:uppercase;letter-spacing:1px}.arena{position:relative;width:min(84vw,360px);height:min(84vw,360px);margin:auto;display:grid;place-items:center}.ring{position:absolute;inset:0;border-radius:50%;border:12px solid #394469;box-shadow:0 0 40px #1e275d}.target{position:absolute;inset:0;border-radius:50%;border:12px solid transparent;border-top-color:#3fffc3;transform:rotate(-6deg);filter:drop-shadow(0 0 9px #3fffc3)}.needle{position:absolute;width:5px;height:47%;top:3%;left:calc(50% - 2.5px);background:linear-gradient(#ffdc6b,#ff668c);border-radius:5px;transform-origin:50% 100%;box-shadow:0 0 14px #ff6c97}.hub{width:125px;height:125px;border-radius:50%;background:#222d57;display:grid;place-items:center;text-align:center;border:2px solid #53649d;z-index:2;box-shadow:0 10px 30px #101329}.hub strong{font-size:21px}.hub span{font-size:12px;color:#bbc9ee}.message{height:36px;font-weight:800;font-size:24px;text-align:center}.actions{width:100%;padding-bottom:22px}.btn{width:100%;border:0;border-radius:20px;padding:20px;background:linear-gradient(110deg,#7c6aff,#ec5dba);color:white;font-size:23px;font-weight:900;box-shadow:0 10px 30px #11122d;touch-action:manipulation}.hint{text-align:center;color:#b7c3e4;font-size:13px;margin:12px 0 0}.flash{animation:pop .2s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-height:680px){.arena{width:min(65vw,270px);height:min(65vw,270px)}h1{font-size:27px}.sub{margin-bottom:8px}}</style></head><body><main class="wrap"><h1>⚡ TAP RUSH</h1><p class="sub">Perfect timing. Massive combos.</p><div class="stats"><div class="stat"><b id="score">0</b><small>Score</small></div><div class="stat"><b id="best">0</b><small>Best</small></div><div class="stat"><b id="lives">❤️❤️❤️</b><small>Lives</small></div></div><div class="arena" id="arena"><div class="ring"></div><div class="target" id="target"></div><div class="needle" id="needle"></div><div class="hub" id="hub"><div><strong id="center">READY?</strong><br><span id="combo">Combo x0</span></div></div></div><div class="message" id="message">Tap START to play</div><div class="actions"><button class="btn" id="action">START GAME</button><p class="hint">Tap anywhere while playing • Hit the glowing green target</p></div></main><script>const $=id=>document.getElementById(id);let score=0,best=0,lives=3,combo=0,angle=180,target=0,prev=0,running=false,ended=false,frame=0;try{best=Number(localStorage.getItem('taprush-best'))||0}catch(e){}$('best').textContent=best;function update(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('combo').textContent='Combo x'+combo}function nextTarget(){target=Math.random()*360;$('target').style.transform=`rotate(${target}deg)`}function tick(t){if(!running)return;let dt=Math.min((t-prev)/1000,.05);prev=t;angle=(angle+dt*(135+Math.min(score*7,260)))%360;$('needle').style.transform=`rotate(${angle}deg)`;frame=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(frame);score=0;lives=3;combo=0;angle=180;running=true;ended=false;nextTarget();update();$('center').textContent='TAP!';$('message').textContent='';$('action').textContent='TAP NOW';prev=performance.now();frame=requestAnimationFrame(tick)}function tap(){if(!running){start();return}let d=Math.abs(((angle-target+180)%360+360)%360-180);if(d<=15){combo++;let pts=d<=6?3:1;score+=pts+(combo>=3?Math.min(combo-2,5):0);$('message').textContent=d<=6?'✨ PERFECT! +'+pts:'⚡ NICE! +'+pts;$('center').textContent='HIT!';if(navigator.vibrate)navigator.vibrate(25);nextTarget()}else{combo=0;lives--;$('message').textContent='💥 MISS!';$('center').textContent='OOPS!';if(navigator.vibrate)navigator.vibrate(80)}if(score>best){best=score;try{localStorage.setItem('taprush-best',best)}catch(e){}}update();$('hub').classList.remove('flash');void $('hub').offsetWidth;$('hub').classList.add('flash');if(lives<=0){running=false;ended=true;cancelAnimationFrame(frame);$('center').textContent='GAME OVER';$('message').textContent='Final score: '+score;$('action').textContent='PLAY AGAIN'}}$('action').addEventListener('click',e=>{e.stopPropagation();tap()});document.body.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;tap()});</script></body></html>
