<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101329"><title>Tap Rush 2.0</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#293568,#101329 70%);font-family:system-ui,-apple-system,sans-serif;color:#fff;min-height:100dvh;touch-action:manipulation}.wrap{max-width:500px;min-height:100dvh;margin:auto;padding:18px 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}h1{font-size:31px;letter-spacing:2px;margin:4px 0 0}.sub{font-size:13px;color:#bac5e5;margin:0}.stats{width:100%;display:flex;justify-content:space-around;text-align:center;margin-top:8px}.stat b{display:block;font-size:26px}.stat small{color:#bac5e5;font-size:10px;letter-spacing:1px}.challenge{border:1px solid #5a6291;border-radius:12px;padding:9px 12px;text-align:center;font-size:12px;width:100%;background:#ffffff0b}.arena{position:relative;width:min(74vw,330px,36dvh);height:min(74vw,330px,36dvh);min-width:210px;min-height:210px;margin:auto;display:grid;place-items:center;--accent:#3fffc3}.ring{position:absolute;inset:0;border-radius:50%;border:12px solid #394469;box-shadow:0 0 40px #1e275d}.target{position:absolute;inset:0;border-radius:50%;border:12px solid transparent;border-top-color:var(--accent);filter:drop-shadow(0 0 10px var(--accent))}.needle{position:absolute;width:5px;height:47%;top:3%;left:calc(50% - 2.5px);background:linear-gradient(#ffdc6b,#ff668c);border-radius:5px;transform-origin:50% 100%;box-shadow:0 0 14px #ff6c97}.hub{width:120px;height:120px;border-radius:50%;background:#222d57;display:grid;place-items:center;text-align:center;border:2px solid #53649d;z-index:2}.hub strong{font-size:19px}.hub span{font-size:12px;color:#bbc9ee}.message{min-height:28px;font-weight:800;font-size:21px;text-align:center}.btn{border:0;border-radius:15px;padding:14px 16px;background:linear-gradient(110deg,#7c6aff,#ec5dba);color:white;font-size:18px;font-weight:900;width:100%}.actions{width:100%;display:grid;gap:10px}.options{display:flex;gap:8px}.small{flex:1;border:1px solid #65709f;background:#202c54;color:white;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:700}.small[aria-pressed=true]{outline:2px solid #f8d96b}.themes{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.theme{border:1px solid #65709f;border-radius:18px;background:#1c2549;color:white;padding:8px 12px;font-size:12px}.theme[aria-pressed=true]{outline:2px solid white}.hint{text-align:center;color:#b7c3e4;font-size:11px;margin:0}.flash{animation:pop .22s}@keyframes pop{50%{transform:scale(1.12)}}.spark{position:absolute;inset:20%;border-radius:50%;border:5px solid var(--accent);pointer-events:none;animation:spark .5s ease-out forwards;z-index:3}@keyframes spark{to{transform:scale(1.8);opacity:0}}@media(max-height:700px){.wrap{gap:5px;padding-top:8px}.challenge{padding:5px}.arena{min-width:170px;min-height:170px}.hub{width:95px;height:95px}h1{font-size:25px}}
</style></head><body><main class="wrap"><h1>⚡ TAP RUSH 2.0</h1><p class="sub">Perfect timing. Massive combos.</p><div class="stats"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="best">0</b><small>BEST</small></div><div class="stat"><b id="coins">0</b><small>COINS</small></div><div class="stat"><b id="lives">❤️❤️❤️</b><small>LIVES</small></div></div><div class="challenge" id="challenge">Daily challenge loading…</div><div class="arena" id="arena"><div class="ring"></div><div class="target" id="target"></div><div class="needle" id="needle"></div><div class="hub" id="hub"><div><strong id="center">READY?</strong><br><span id="combo">Combo x0</span></div></div></div><div class="message" id="message" aria-live="polite">Tap START to play</div><div class="actions"><button class="btn" id="action">START GAME</button><div class="options"><button class="small" id="sound" aria-pressed="true">🔊 Sound on</button><button class="small" id="share">↗ Share score</button></div><div class="themes" id="themes"></div><p class="hint">Tap anywhere during play • Hit the glowing target • Earn coins to unlock themes</p></div></main><script>
const $=id=>document.getElementById(id);const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val))}catch{}};
let score=0,best=get('taprush-best',0),coins=get('taprush-coins',0),lives=3,combo=0,angle=180,target=0,prev=0,running=false,frame=0,sound=get('taprush-sound',true),theme=get('taprush-theme',0),audio=null;
const themes=[{name:'Mint',color:'#3fffc3',cost:0},{name:'Pink',color:'#ff75c8',cost:15},{name:'Gold',color:'#ffd45d',cost:30},{name:'Ice',color:'#76d9ff',cost:45}];const today=new Date().toLocaleDateString('en-CA');let daily=get('taprush-daily',{});if(daily.date!==today)daily={date:today,done:false};const dailyGoal=20;
function renderThemes(){ $('themes').innerHTML='';themes.forEach((t,i)=>{let unlocked=i===0||get('taprush-unlock-'+i,false);let b=document.createElement('button');b.className='theme';b.style.borderColor=t.color;b.textContent=t.name+(unlocked?'':` 🔒${t.cost}`);b.setAttribute('aria-pressed',String(i===theme));b.onclick=e=>{e.stopPropagation();if(!unlocked){if(coins<t.cost){$('message').textContent=`Need ${t.cost} coins`;return}coins-=t.cost;save('taprush-coins',coins);save('taprush-unlock-'+i,true)}theme=i;save('taprush-theme',theme);applyTheme();update();renderThemes()};$('themes').append(b)})}
function applyTheme(){$('arena').style.setProperty('--accent',themes[theme].color)}function update(){$('score').textContent=score;$('best').textContent=best;$('coins').textContent=coins;$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('combo').textContent='Combo x'+combo;$('challenge').textContent=daily.done?'🏆 Daily challenge complete! +10 coins earned':`🎯 Daily challenge: Score ${dailyGoal} points in one game (+10 coins)`}
function tone(freq,duration=.09){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function nextTarget(){target=Math.random()*360;$('target').style.transform=`rotate(${target}deg)`}function tick(t){if(!running)return;let dt=Math.min((t-prev)/1000,.05);prev=t;angle=(angle+dt*(135+Math.min(score*7,260)))%360;$('needle').style.transform=`rotate(${angle}deg)`;frame=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(frame);score=0;lives=3;combo=0;angle=180;running=true;nextTarget();update();$('center').textContent='TAP!';$('message').textContent='';$('action').textContent='TAP NOW';prev=performance.now();frame=requestAnimationFrame(tick)}
function spark(){let s=document.createElement('div');s.className='spark';$('arena').append(s);setTimeout(()=>s.remove(),550)}
function tap(){if(!running){start();return}let d=Math.abs(((angle-target+180)%360+360)%360-180);if(d<=15){combo++;let pts=(d<=6?3:1)+(combo>=3?Math.min(combo-2,5):0);score+=pts;$('message').textContent=(d<=6?'✨ PERFECT! +':'⚡ NICE! +')+pts;$('center').textContent='HIT!';tone(d<=6?880:660);spark();nextTarget();if(!daily.done&&score>=dailyGoal){daily.done=true;coins+=10;save('taprush-daily',daily);save('taprush-coins',coins);$('message').textContent='🏆 DAILY +10 COINS!'}}else{combo=0;lives--;$('message').textContent='💥 MISS!';$('center').textContent='OOPS!';tone(190,.18)}if(score>best){best=score;save('taprush-best',best)}update();$('hub').classList.remove('flash');void $('hub').offsetWidth;$('hub').classList.add('flash');if(lives<=0){running=false;cancelAnimationFrame(frame);let reward=Math.floor(score/5);coins+=reward;save('taprush-coins',coins);update();renderThemes();$('center').textContent='GAME OVER';$('message').textContent=`Score ${score} • +${reward} coins`;$('action').textContent='PLAY AGAIN'}}
$('action').addEventListener('click',e=>{e.stopPropagation();tap()});document.body.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;tap()});$('sound').onclick=e=>{e.stopPropagation();sound=!sound;save('taprush-sound',sound);$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off';$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(700)};$('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off';$('sound').setAttribute('aria-pressed',String(sound));$('share').onclick=async e=>{e.stopPropagation();let text=`I scored ${best} in Tap Rush! Can you beat me? ${location.href}`;try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);$('message').textContent='Score copied!'}}catch{}};applyTheme();renderThemes();update();
</script></body></html>
